# Runs the one gate on every pull request and every push to main.
# No secrets: Cloudflare builds and deploys by itself through its GitHub app (K12, K14).
name: gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI7: the browser tests in 5 parts, each its own runner (scripts/e2e-shards.mjs).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Gate
        env:
          E2E_SHARD: ${{ matrix.shard }}/5
        run: npm run gate
