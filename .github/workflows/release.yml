# Release by tag (M4.6, K12, K14). Guarded by scripts/release.test.mjs; how to use: docs/deploy.md.
#
# A pushed tag vX.Y.Z runs the gate on the tagged commit, creates the GitHub Release with the
# notes of that version from CHANGELOG.md (generated by GitHub when the section is missing) and
# moves the branch `release` to the tag. Cloudflare Workers Builds deploys `release` as the main
# site by itself: GitHub holds no Cloudflare secret, this workflow never calls wrangler.
#
# Rollback: run this workflow by hand (Actions -> release -> Run workflow) with an older tag. It
# moves `release` back to that tag without the gate (the tag passed it when it was released) and
# without touching Releases; Cloudflare then deploys it.
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to put on the main site again, e.g. v0.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI7: the browser tests in 5 parts, each its own runner (scripts/e2e-shards.mjs).
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Gate
        env:
          E2E_SHARD: ${{ matrix.shard }}/5
        run: npm run gate

  release:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME, notes generated"
            notes=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run: the Release exists, refresh its notes when CHANGELOG.md has them.
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}"
          fi
      - name: Move the branch release to the tag
        run: git push --force origin "$(git rev-parse HEAD):refs/heads/release"

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the branch release to the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}") || {
            echo "::error::no tag $TAG"
            exit 1
          }
          git push --force origin "$sha:refs/heads/release"
          echo "release -> $TAG ($sha)" >> "$GITHUB_STEP_SUMMARY"
