<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one screen, no page scroll. Top bar; below it a grid: scene (left, large) + explanation (right), event table across the bottom.
     Lessons and glossary live in a slide-in drawer. On a phone the panels stack and the page scrolls. */
  :root {
    --bg: #F3F5F7; --panel: #FFFFFF; --ink: #15212C; --muted: #5E6C7A; --line: #C7D0D9;
    --attack: #D8432B; --safe: #0B8A78; --legit: #2B67D6; --code: #EDF0F3; --row: #EEF2F6;
    --sans: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0F151C; --panel: #17202A; --ink: #E7EDF3; --muted: #93A1AF; --line: #2C3947; --attack: #FF6F55; --safe: #3CCBB3; --legit: #73A5FF; --code: #0F151C; --row: #1F2B37; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #0F151C; --panel: #17202A; --ink: #E7EDF3; --muted: #93A1AF; --line: #2C3947; --attack: #FF6F55; --safe: #3CCBB3; --legit: #73A5FF; --code: #0F151C; --row: #1F2B37; color-scheme: dark }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  [hidden] { display: none !important; }
  .app { box-sizing: border-box; height: 100dvh; min-height: 34rem; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .6rem; padding-block: .6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; }
  .brand { font-weight: 700; letter-spacing: .12em; font-size: .95rem; }
  .top .note { margin-left: auto; color: var(--muted); font-size: .82rem; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .35rem .7rem; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  button[aria-pressed="true"], button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 23rem; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); gap: .6rem; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .p-log { grid-column: 1 / -1; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .7rem; padding: .4rem .7rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar .sp { flex: 1; }
  h1 { font-size: 1.1rem; line-height: 1.2; margin: 0; }
  h2 { font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 400; }
  h3 { font-size: 1rem; line-height: 1.3; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .sub { color: var(--muted); font-size: .82rem; flex: 1 1 12rem; min-width: 0; }
  .stage { flex: 1; min-height: 0; background: #EDF0F3; }
  .stage svg { display: block; width: 100%; height: 100%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
  .seg button { border: none; border-radius: 999px; background: transparent; padding: .25rem .8rem; }
  .seg button[aria-pressed="true"][data-mode="attack"] { background: var(--attack); color: #fff; }
  .seg button[aria-pressed="true"][data-mode="defence"] { background: var(--safe); color: #fff; }
  .depth { display: flex; border-bottom: 1px solid var(--line); }
  .depth button { flex: 1; border: none; border-radius: 0; background: transparent; padding: .55rem .4rem; color: var(--muted); border-bottom: 2px solid transparent; }
  .depth button[aria-selected="true"] { background: transparent; color: var(--ink); border-bottom-color: var(--ink); }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .pad { padding: .8rem .9rem; display: flex; flex-direction: column; gap: .6rem; }
  .badge { align-self: flex-start; font-size: .78rem; padding: .1rem .55rem; border-radius: 999px; border: 1px solid var(--safe); color: var(--safe); }
  pre { margin: 0; padding: .6rem .75rem; background: var(--code); border-radius: 8px; font-family: var(--mono); font-size: .78rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  pre mark { background: transparent; color: var(--attack); font-weight: 700; }
  dl { margin: 0; display: grid; grid-template-columns: 6.5rem 1fr; font-size: .84rem; }
  dt, dd { margin: 0; padding: .3rem 0; border-top: 1px solid var(--line); }
  dt { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  .chips button { font-size: .8rem; padding: .2rem .6rem; border-radius: 999px; }
  .legend { display: flex; flex-wrap: wrap; gap: .2rem .8rem; font-size: .78rem; color: var(--muted); }
  .legend i { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .3rem; }
  .ctl { display: flex; gap: .3rem; }
  #play { min-width: 5rem; background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .3rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  thead th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 400; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--row); }
  tr.now { background: var(--row); font-weight: 700; }
  tr.future { color: var(--muted); }
  tr.future .num { opacity: .45; }
  td.what { font-family: var(--mono); font-size: .78rem; }
  button.num { width: 1.5rem; height: 1.5rem; padding: 0; border: 0; border-radius: 50%; color: #fff; font-family: var(--mono); font-size: .75rem; font-weight: 700; }
  .k-attack { color: var(--attack); font-weight: 700; } .k-safe { color: var(--safe); font-weight: 700; }
  button.link { background: none; border: 0; padding: 0; border-radius: 2px; color: var(--legit); text-decoration: underline; text-underline-offset: 2px; text-align: left; }
  button.term { background: none; border: 0; padding: 0; border-radius: 2px; color: inherit; font: inherit; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; }
  button.term:hover { color: var(--legit); }
  .tag { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .where { font-size: .8rem; color: var(--muted); }
  .hint { color: var(--muted); font-size: .78rem; }
  /* Drawer */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 21, 28, .45); }
  .drawer { box-sizing: border-box; position: fixed; top: 0; bottom: 0; left: 0; z-index: 21; width: min(27rem, 100vw); background: var(--panel); border-right: 1px solid var(--ink); display: flex; flex-direction: column; }
  .drawer .tabs { display: flex; gap: .3rem; }
  .drawer .tabs button { flex: 1; }
  .drawer .tools { padding: .5rem .7rem; display: flex; flex-direction: column; gap: .5rem; border-bottom: 1px solid var(--line); }
  input[type="search"] { box-sizing: border-box; width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .65rem; }
  input[type="search"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  button.x { border: 0; background: none; padding: 0 .3rem; font-size: 1.3rem; line-height: 1; color: var(--muted); }
  .dsec { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: .5rem .8rem .25rem; font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: .5rem; }
  .ditem { box-sizing: border-box; display: flex; gap: .6rem; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: .35rem .8rem; font-size: .84rem; line-height: 1.35; }
  .ditem .id { flex: none; width: 1.8rem; font-family: var(--mono); font-size: .72rem; padding-top: .15rem; color: var(--muted); }
  .ditem .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ditem .tx span { color: var(--muted); font-size: .8rem; }
  .ditem .st { flex: none; font-family: var(--mono); font-size: .68rem; color: var(--muted); padding-top: .2rem; }
  div.ditem b { font-weight: 500; color: var(--muted); }
  button.ditem:hover { background: var(--row); }
  button.ditem .st { color: var(--safe); font-weight: 700; }
  button.ditem[aria-current="true"] { background: var(--row); box-shadow: inset 3px 0 0 var(--attack); }
  .gitem { padding: .55rem .8rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .2rem; font-size: .86rem; }
  .gitem .hd { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .empty { padding: .8rem; color: var(--muted); }
  /* Term popover */
  .pop { box-sizing: border-box; position: absolute; z-index: 30; width: min(22rem, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--ink); border-radius: 12px; box-shadow: 4px 4px 0 rgba(21, 33, 44, .3); padding: .8rem .9rem; display: flex; flex-direction: column; gap: .5rem; font-size: .88rem; }
  .pop:focus { outline: none; }
  .pop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .pop-head strong { font-size: 1.05rem; line-height: 1.3; }
  .hit { cursor: help; fill: transparent; }
  .hit:hover { fill: rgba(31, 42, 68, .06); }
  .hit:focus-visible, .zlabel:focus-visible { outline: 2px solid #1F2A44; outline-offset: 2px; }
  .zlabel { cursor: help; }
  @keyframes pulse { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .9; } }
  @media (prefers-reduced-motion: no-preference) { #ring.pulse { animation: pulse .6s ease-out; } }
  @media (max-width: 860px) {
    .app { height: auto; min-height: 0; }
    .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
    .panel { overflow: visible; }
    .stage { overflow-x: auto; border-radius: 0 0 12px 12px; }
    .stage svg { min-width: 34rem; height: auto; }
    .scroll { overflow-x: auto; }
    .top .note { display: none; }
  }
</style>

<script>
  const KIND = {
    legit: { color: '#2B67D6', mark: '', cls: 'k-legit' },
    attack: { color: '#E8523A', mark: '! ', cls: 'k-attack' },
    safe: { color: '#17907E', mark: '✓ ', cls: 'k-safe' },
  };

  // ---------- Lesson data: a lesson is data, the player knows nothing about a particular lesson ----------
  const sql1 = { title: 'Форма входа', from: 'attacker', to: 'server', kind: 'legit', label: 'GET /login', result: 'страница входа',
    simple: 'Атакующий открывает обычную страницу входа в интернет-магазин. Пока ничего плохого: так делает любой посетитель.',
    steps: 'Браузер запрашивает страницу /login. Сервер отдаёт форму с полями «Логин» и «Пароль».',
    deep: 'Форма отправит запрос POST /login с параметрами login и password. Сервер подставит их в SQL-запрос к таблице users.',
    code: 'POST /login\nlogin=...&password=...' };
  const sql2 = { title: 'Хитрый логин', from: 'attacker', to: 'server', kind: 'attack', label: "admin' --", what: "POST /login   login=admin' --", result: 'принято как текст',
    simple: 'Вместо логина он вводит admin и приписывает кавычку с двумя дефисами. Для человека это мусор, а для базы данных — служебные знаки.',
    steps: 'В поле «Логин» уходит строка admin\' --, пароль любой. Сервер принимает её как обычный текст.',
    deep: 'Кавычка в SQL закрывает строку, а два дефиса начинают комментарий до конца строки. Сервер не проверяет ввод и не отделяет его от кода запроса.',
    code: "POST /login\nlogin=⟦admin' --⟧&password=123" };

  const ph1 = { title: 'Письмо-приманка', from: 'attacker', to: 'user', kind: 'attack', label: 'письмо', icon: 'mail', what: 'письмо «Ваш счёт заблокирован»', result: 'доставлено',
    simple: 'Сотруднику приходит письмо будто бы от банка: счёт заблокирован, срочно подтвердите данные. Срочность нужна, чтобы человек не успел подумать.',
    steps: 'Атакующий рассылает письмо с логотипом банка и ссылкой. Имя отправителя выглядит как у банка, адрес — нет.',
    deep: 'Отображаемое имя отправителя задаётся произвольно. Подделку самого адреса ограничивают SPF, DKIM и DMARC, поэтому чаще берут похожий домен.',
    code: 'От: Банк <support@⟦bank-login.example⟧>\nТема: Ваш счёт заблокирован' };
  const ph2 = { title: 'Переход по ссылке', from: 'user', to: 'fake', kind: 'legit', label: 'открыть ссылку', what: 'GET https://bank-login.example/', result: 'страница открыта',
    simple: 'Сотрудник нажимает на ссылку. Открывается страница, как две капли воды похожая на вход в банк.',
    steps: 'Браузер открывает сайт атакующего. Замок в адресной строке есть: он говорит только о шифровании, а не о том, чей это сайт.',
    deep: 'Сертификат для своего домена может получить кто угодно, в том числе атакующий. Отличие только в адресе.',
    code: 'настоящий:   https://⟦bank.example⟧/login\nподдельный:  https://⟦bank-login.example⟧/' };

  const mi1 = { title: '«Роутер — это я»', from: 'attacker', to: 'user', kind: 'attack', label: 'ARP-ответ', what: 'ARP: адрес 192.0.2.1 находится у меня', result: 'ноутбук поверил',
    simple: 'В общей сети кафе атакующий объявляет ноутбуку жертвы: «роутер — это я». Ноутбук верит на слово: в локальной сети так принято.',
    steps: 'Атакующий шлёт поддельные ARP-ответы. Ноутбук записывает, что адрес роутера соответствует сетевой карте атакующего.',
    deep: 'ARP (RFC 826) не проверяет подлинность ответов: пришедший ответ просто перезаписывает таблицу соответствий. Этот приём называется ARP spoofing.',
    code: '192.0.2.1  →  ⟦aa:bb:cc:00:00:66⟧   (карта атакующего)' };

  const LESSONS = [
    {
      id: 'sql', cat: 'B1', title: 'SQL-инъекция', defenceName: 'параметризованный запрос',

    { id: 'phishing', t: 'Фишинг', c: 'Вход и люди', m: `фишинг${E}|Phishing`, d: 'Обман, при котором человека заманивают на поддельную страницу или просят сообщить секрет, выдавая себя за банк, начальника или службу поддержки.', see: 'soceng fakepage proxyphish', l: 'I1 I2' },
    { id: 'proxyphish', t: 'Прокси-фишинг', c: 'Вход и люди', m: `прокси-фишинг${E}`, d: 'Фишинг, при котором поддельная страница тут же пересылает всё настоящему сайту и обратно. Так перехватывают и пароль, и одноразовый код.', see: 'phishing 2fa passkey', l: 'F6' },
    { id: 'soceng', t: 'Социальная инженерия', c: 'Вход и люди', m: `социальн${E} инженери${E}`, d: 'Атака не на программу, а на человека: давление, срочность, игра на доверии.', see: 'phishing', l: 'I1 I4' },
    { id: 'fakepage', t: 'Поддельная страница', c: 'Вход и люди', m: `поддельн${E} страниц${E}`, d: 'Копия настоящей страницы входа на чужом адресе. Всё, что в неё вводят, получает атакующий.', see: 'phishing domain', l: 'I1' },
    { id: 'domain', t: 'Домен', c: 'Вход и люди', m: `домен${E}`, d: 'Имя сайта в адресе, например bank.example. Понять, чей это сайт, можно только по нему, а не по внешнему виду страницы.', see: 'cert fakepage', l: 'I1' },
    { id: 'spf', t: 'SPF, DKIM, DMARC', c: 'Вход и люди', m: 'SPF|DKIM|DMARC', d: 'Три проверки почты: с разрешённого ли сервера пришло письмо (SPF), не изменено ли оно (DKIM) и что делать с письмами, которые проверку не прошли (DMARC).', see: 'phishing domain', l: 'I3' },
    { id: 'pwdmgr', t: 'Менеджер паролей', c: 'Вход и люди', m: `менеджер${E}(?: паролей)?`, d: 'Программа, которая хранит пароли и подставляет их только на том сайте, для которого они сохранены.', see: 'domain passkey', l: 'I1' },
    { id: '2fa', t: 'Второй фактор', c: 'Вход и люди', m: `втор${E} фактор${E}`, d: 'Дополнительное подтверждение входа помимо пароля: код из приложения, уведомление на телефоне или аппаратный ключ.', see: 'passkey proxyphish layers', l: 'F6' },
    { id: 'passkey', t: 'Passkeys', c: 'Вход и люди', m: 'passkeys?|WebAuthn|FIDO2', d: 'Вход без пароля: устройство хранит ключ, привязанный к домену сайта, и на поддельном сайте он не сработает. Стандарты называются WebAuthn и FIDO2.', see: '2fa domain key', l: 'F7' },
    { id: 'stuffing', t: 'Credential stuffing', c: 'Вход и люди', m: 'credential stuffing', d: 'Проверка украденных пар «логин и пароль» на других сайтах в расчёте на то, что человек повторяет пароль.', see: 'leak 2fa', l: 'F2' },
    { id: 'leak', t: 'Утечка', c: 'Вход и люди', m: `утечк${E}`, d: 'Случай, когда данные сервиса попали к посторонним, например база логинов и паролей.', see: 'stuffing', l: 'F1 F2' },
  ];
  const NODE_TERM = { attacker: 'attacker', server: 'server', db: 'db', user: 'victim', fake: 'fakepage', bank: 'site', router: 'router' };
  const TERM = Object.fromEntries(GLOSSARY.map((t) => [t.id, t]));
  const TERM_RX = GLOSSARY.filter((t) => t.m).map((t) => ({ id: t.id, rx: new RegExp(`(?<![\\p{L}\\p{N}])(?:${t.m})(?![\\p{L}\\p{N}])`, 'giu') }));
  const CAT = {};
  SECTIONS.forEach((s) => s.items.forEach(([title, desc], i) => { CAT[s.k + (i + 1)] = { id: s.k + (i + 1), sec: s, title, desc }; }));
  const words = (s) => (s ? s.split(' ') : []);

  // ---------- Player ----------
  const FIRST = 'phishing'; // the lesson shown on load: the simplest one to follow
  const state = { li: 0, mode: 'attack', si: 0, depth: 'simple', playing: false, speed: 1 };
  const SPEEDS = [1, 2, 0.5];
  const W = 760, LANE = 84, ICON_Y = 100;
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let raf = 0, timer = 0;

  const $ = (id) => document.getElementById(id);
  const lesson = () => LESSONS[state.li];
  const steps = () => lesson().modes[state.mode];
  const nodeIndex = (id) => lesson().nodes.findIndex((n) => n.id === id);
  const cx = (i) => (i + 0.5) * W / lesson().nodes.length;
  const svgEl = (name, attrs, text) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const el = (name, cls, text) => {
    const e = document.createElement(name);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  function btn(cls, text, onClick) {
    const b = el('button', cls, text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }

  function buildScene() {
    const l = lesson();
    const svg = svgEl('svg', { viewBox: `0 0 ${W} 300`, role: 'group', 'aria-label': `Схема урока «${l.title}»`, 'font-family': 'Onest, system-ui, sans-serif' });
    svg.append(svgEl('rect', { width: W, height: 300, fill: '#EDF0F3' }));
    for (const z of l.zones) {
      const x0 = cx(z.from) - 85, x1 = cx(z.to) + 85, color = z.danger ? '#E8523A' : '#1F2A44';
      svg.append(svgEl('rect', { x: x0, y: 30, width: x1 - x0, height: 256, rx: 10, fill: 'none', stroke: color, 'stroke-width': 1.5, 'stroke-dasharray': '2 7', 'stroke-linecap': 'round' }));
      svg.append(svgEl('text', { x: x0 + 12, y: 50, 'font-size': 10, 'letter-spacing': 1.5, fill: color, 'font-family': 'JetBrains Mono, monospace', class: 'zlabel', 'data-term': 'trust', tabindex: 0, role: 'button', 'aria-label': `Зона «${z.label}»: что такое граница доверия` }, z.label));
    }
    svg.append(svgEl('line', { x1: cx(0), y1: LANE, x2: cx(l.nodes.length - 1), y2: LANE, stroke: '#1F2A44', 'stroke-width': 1.5, opacity: .25 }));
    l.nodes.forEach((n, i) => {
      const x = cx(i);
      svg.append(svgEl('line', { x1: x, y1: LANE, x2: x, y2: ICON_Y + 6, stroke: '#1F2A44', 'stroke-width': 1.5, opacity: .25 }));
      const g = svgEl('g', { transform: `translate(${x - 75} ${ICON_Y})` });
      g.append(svgEl('use', { href: `#ic-${n.icon}`, width: 150, height: 133 }), svgEl('use', { href: '#feather', width: 150, height: 133 }));
      svg.append(g);
      svg.append(svgEl('text', { x, y: 254, 'font-size': 13, 'font-weight': 700, 'text-anchor': 'middle', fill: '#1F2A44' }, n.name));
      svg.append(svgEl('text', { x, y: 271, 'font-size': 10, 'text-anchor': 'middle', fill: '#5E6C7A', 'font-family': 'JetBrains Mono, monospace' }, n.sub));
    });
    svg.append(svgEl('rect', { id: 'ring', x: 0, y: ICON_Y - 2, width: 150, height: 137, rx: 12, fill: 'none', 'stroke-width': 3 }));
    l.nodes.forEach((n, i) => {
      svg.append(svgEl('rect', { x: cx(i) - 75, y: ICON_Y, width: 150, height: 178, rx: 12, class: 'hit', 'data-term': NODE_TERM[n.id], tabindex: 0, role: 'button', 'aria-label': `${n.name}: что это` }));
    });
    svg.append(svgEl('line', { id: 'trail', y1: LANE, y2: LANE, 'stroke-width': 3, 'stroke-linecap': 'round' }));
    svg.append(svgEl('g', { id: 'msg' }));
    $('stage').replaceChildren(svg);
  }

  function buildMessage(st) {
    const g = $('msg');
    g.replaceChildren();
    const color = KIND[st.kind].color;
    if (st.icon) {
      g.append(svgEl('circle', { cx: 2, cy: 2, r: 21, fill: '#1F2A44', opacity: .3 }));
      const clip = svgEl('g', { 'clip-path': 'url(#token)' });
      clip.append(svgEl('rect', { x: -22, y: -22, width: 44, height: 44, fill: '#EDF0F3' }));
      clip.append(svgEl('use', { href: `#ic-${st.icon}`, x: -24, y: -22, width: 48, height: 43 }));
      g.append(clip, svgEl('circle', { cx: 0, cy: 0, r: 21, fill: 'none', stroke: color, 'stroke-width': 3 }));
      return;
    }
    const text = KIND[st.kind].mark + st.label;
    const w = Math.max(48, text.length * 6.9 + 18);
    g.append(svgEl('rect', { x: -w / 2 + 3, y: -9, width: w, height: 24, rx: 5, fill: '#1F2A44', opacity: .3 }));
    g.append(svgEl('rect', { x: -w / 2, y: -12, width: w, height: 24, rx: 5, fill: color }));
    g.append(svgEl('text', { x: 0, y: 4, 'font-size': 11, 'font-weight': 700, 'text-anchor': 'middle', fill: '#FFFFFF', 'font-family': 'JetBrains Mono, monospace' }, text));
  }

  function setMessageX(x, x0) {
    $('msg').setAttribute('transform', `translate(${x} ${LANE})`);
    const trail = $('trail');
    trail.setAttribute('x1', x0);
    trail.setAttribute('x2', x);
  }

  function showStep(animate, done) {
    cancelAnimationFrame(raf);
    clearTimeout(timer);
    const st = steps()[state.si];
    const x0 = cx(nodeIndex(st.from)), x1 = cx(nodeIndex(st.to));
    const color = KIND[st.kind].color;
    buildMessage(st);
    $('trail').setAttribute('stroke', color);
    const ring = $('ring');
    ring.setAttribute('x', x1 - 75);
    ring.setAttribute('stroke', color);
    ring.classList.remove('pulse');
    const arrive = () => {
      setMessageX(x1, x0);
      ring.setAttribute('opacity', .9);
      void ring.getBoundingClientRect();
      ring.classList.add('pulse');
      if (done) done();
    };
    if (!animate || reduced.matches || x0 === x1) { arrive(); return; }
    ring.setAttribute('opacity', 0);
    const dur = 900 / state.speed;
    let t0 = 0;
    const tick = (t) => {
      if (!t0) t0 = t;
      const p = Math.min(1, (t - t0) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      setMessageX(x0 + (x1 - x0) * e, x0);
      if (p < 1) raf = requestAnimationFrame(tick); else arrive();
    };
    setMessageX(x0, x0);
    raf = requestAnimationFrame(tick);
  }

  // ---------- Terms: find glossary words in a text and turn them into buttons ----------
  function findTerms(text, skip) {
    const hits = [];
    for (const { id, rx } of TERM_RX) {
      if (id === skip) continue;
      rx.lastIndex = 0;
      let m;
      while ((m = rx.exec(text))) hits.push({ id, s: m.index, e: m.index + m[0].length });
    }
    hits.sort((a, b) => a.s - b.s || b.e - a.e);
    let end = 0;
    return hits.filter((h) => { if (h.s < end) return false; end = h.e; return true; });
  }

  function termBtn(id, text, cls) {
    const b = btn(cls === undefined ? 'term' : cls, text);
    b.dataset.term = id;
    return b;
  }

  // Each term is linked once per text block, at its first occurrence.
  function rich(text, skip) {
    const frag = document.createDocumentFragment();
    const seen = new Set();
    let pos = 0;
    for (const h of findTerms(text, skip)) {
      if (seen.has(h.id)) continue;
      seen.add(h.id);
      frag.append(text.slice(pos, h.s), termBtn(h.id, text.slice(h.s, h.e)));
      pos = h.e;
    }
    frag.append(text.slice(pos));
    return frag;
  }

  function lessonLinks(ids) {
    const frag = document.createDocumentFragment();
    ids.forEach((id, i) => {
      if (i) frag.append(', ');
      const li = LESSONS.findIndex((l) => l.cat === id);
      if (li >= 0) frag.append(btn('link', CAT[id].title, () => navTo(LESSONS[li].id)));
      else frag.append(`${CAT[id].title} (в плане)`);
    });
    return frag;
  }

  let popAnchor = null;
  function placePop() {
    const pop = $('pop');
    if (pop.hidden || !popAnchor || !popAnchor.isConnected) return;
    const r = popAnchor.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, vw - w - 12));
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 8) top = r.top - 8 - h > 8 ? r.top - 8 - h : Math.max(8, window.innerHeight - 8 - h);
    pop.style.left = `${left + window.scrollX}px`;
    pop.style.top = `${top + window.scrollY}px`;
  }

  function openTerm(id, anchor) {
    const t = TERM[id];
    if (!t) return;
    const pop = $('pop');
    if (!(anchor && pop.contains(anchor))) popAnchor = anchor;
    const head = el('div', 'pop-head');
    const x = btn('x', '×', () => closePop(true));
    x.setAttribute('aria-label', 'Закрыть');
    head.append(el('strong', '', t.t), x);
    const def = el('p');
    def.append(rich(t.d, id));
    pop.replaceChildren(el('span', 'tag', t.c), head, def);
    if (t.see) {
      const chips = el('div', 'chips');
      chips.append(...words(t.see).map((s) => termBtn(s, TERM[s].t, '')));
      pop.append(el('span', 'where', 'Связанные слова'), chips);
    }
    if (t.l) {
      const where = el('p', 'where', 'Уроки: ');
      where.append(lessonLinks(words(t.l)));
      pop.append(where);
    }
    pop.hidden = false;
    placePop();
    try { pop.focus({ preventScroll: true }); } catch (e) {}
  }

  function closePop(refocus) {
    const pop = $('pop');
    if (pop.hidden) return;
    pop.hidden = true;
    if (refocus && popAnchor && popAnchor.isConnected && popAnchor.focus) popAnchor.focus({ preventScroll: true });
    popAnchor = null;
  }

  // ---------- Drawer: all lessons by section, and the glossary ----------
  const dr = { tab: 'lessons', q: '' };
  function renderDrawer() {
    const isL = dr.tab === 'lessons';
    $('tab-lessons').setAttribute('aria-pressed', String(isL));
    $('tab-glossary').setAttribute('aria-pressed', String(!isL));
    $('drawer-title').textContent = isL ? `Уроки · ${Object.keys(CAT).length} в ${SECTIONS.length} разделах` : `Словарь · ${GLOSSARY.length} слов`;
    $('drawer-q').placeholder = isL ? 'Найти урок' : 'Найти слово';
    const q = dr.q.trim().toLowerCase();
    const out = [];
    if (isL) {
      for (const s of SECTIONS) {
        const all = s.items.map((_, i) => CAT[s.k + (i + 1)]);
        const shown = all.filter((c) => !q || `${c.title} ${c.desc} ${s.name}`.toLowerCase().includes(q));
        if (!shown.length) continue;
        const head = el('div', 'dsec');
        head.append(el('span', '', `${s.k} · ${s.name}`), el('span', '', String(all.length)));
        out.push(head);
        for (const c of shown) {
          const li = LESSONS.findIndex((l) => l.cat === c.id);
          const item = li >= 0 ? btn('ditem', '', () => navTo(LESSONS[li].id)) : el('div', 'ditem');
          if (li >= 0 && li === state.li) item.setAttribute('aria-current', 'true');
          const tx = el('span', 'tx');
          tx.append(el('b', '', c.title), el('span', '', c.desc));
          item.append(el('span', 'id', c.id), tx, el('span', 'st', li >= 0 ? 'открыть' : 'в плане'));
          out.push(item);
        }
      }
      if (!out.length) out.push(el('p', 'empty', 'Ничего не нашлось.'));
    } else {
      const list = GLOSSARY.filter((t) => !q || `${t.t} ${t.d}`.toLowerCase().includes(q)).sort((a, b) => a.t.localeCompare(b.t, 'ru'));
      for (const t of list) {
        const a = el('div', 'gitem');
        const hd = el('div', 'hd');
        hd.append(el('b', '', t.t), el('span', 'tag', t.c));
        const def = el('p');
        def.append(rich(t.d, t.id));
        a.append(hd, def);
        if (t.l) {
          const where = el('p', 'where', 'Уроки: ');
          where.append(lessonLinks(words(t.l)));
          a.append(where);
        }
        out.push(a);
      }
      if (!out.length) out.push(el('p', 'empty', 'Такого слова в словаре пока нет.'));
    }
    $('drawer-body').replaceChildren(...out);
  }

  let drawerOpener = null;
  function openDrawer(tab, opener) {
    stop();
    closePop();
    drawerOpener = opener || null;
    dr.tab = tab; dr.q = '';
    $('drawer-q').value = '';
    $('drawer').hidden = false;
    $('scrim').hidden = false;
    renderDrawer();
    $('drawer-body').scrollTop = 0;
    const cur = $('drawer-body').querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'center' });
    try { $('drawer-q').focus({ preventScroll: true }); } catch (e) {}
  }

  function closeDrawer() {
    if ($('drawer').hidden) return;
    closePop();
    $('drawer').hidden = true;
    $('scrim').hidden = true;
    if (drawerOpener && drawerOpener.focus) drawerOpener.focus({ preventScroll: true });
    drawerOpener = null;
  }

  // ---------- Lesson panels ----------
  function codeBlock(code) {
    const pre = el('pre');
    code.split(/(⟦[^⟧]*⟧)/).forEach((part) => {
      if (part.startsWith('⟦')) pre.append(el('mark', '', part.slice(1, -1)));
      else pre.append(part);
    });
    return pre;
  }

  function renderExplain() {
    const st = steps()[state.si];
    const box = $('explain');
    box.replaceChildren();
    if (state.mode === 'defence') box.append(el('span', 'badge', `Защита: ${lesson().defenceName}`));
    box.append(el('h3', '', `Шаг ${state.si + 1} из ${steps().length}. ${st.title}`));
    const p = el('p');
    p.append(rich(st[state.depth]));
    box.append(p);
    if (state.depth === 'deep' && st.code) box.append(codeBlock(st.code));
    document.querySelectorAll('#depth button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.depth === state.depth)));
  }

  function renderHead() {
    const l = lesson(), c = CAT[l.cat];
    $('lesson-title').textContent = l.title;
    $('lesson-sub').textContent = `${c.sec.name} · ${c.desc}`;
    $('note').textContent = `готово ${LESSONS.length} из ${Object.keys(CAT).length} уроков`;
    $('passport').replaceChildren(...l.passport.flatMap(([k, v]) => {
      const dt = el('dt'), dd = el('dd');
      dt.append(rich(k));
      dd.append(rich(v));
      return [dt, dd];
    }));
    const ids = new Set();
    const scan = (text) => { if (text) findTerms(text).forEach((h) => ids.add(h.id)); };
    for (const mode of Object.values(l.modes)) for (const st of mode) { scan(st.simple); scan(st.steps); scan(st.deep); }
    l.passport.forEach(([k, v]) => { scan(k); scan(v); });
    const list = [...ids].map((id) => TERM[id]).sort((a, b) => a.t.localeCompare(b.t, 'ru'));
    $('lesson-terms').replaceChildren(...list.map((t) => termBtn(t.id, t.t, '')));
  }

  // The table lists every step of the lesson; steps after the current one are dimmed.
  function renderLog() {
    const name = (id) => lesson().nodes[nodeIndex(id)].name;
    $('log').replaceChildren(...steps().map((st, i) => {
      const tr = el('tr', i === state.si ? 'now' : i > state.si ? 'future' : '');
      const num = btn('num', String(i + 1));
      num.style.background = KIND[st.kind].color;
      num.setAttribute('aria-label', `Шаг ${i + 1}: ${st.title}`);
      if (i === state.si) num.setAttribute('aria-current', 'step');
      const td = el('td');
      td.append(num);
      tr.append(td, el('td', '', st.title), el('td', '', name(st.from)), el('td', '', st.from === st.to ? '—' : name(st.to)), el('td', 'what', st.what || st.label), el('td', KIND[st.kind].cls, KIND[st.kind].mark + st.result));
      tr.addEventListener('click', () => { stop(); go(i, i === state.si + 1); });
      return tr;
    }));
    const now = $('log').querySelector('tr.now');
    if (now && now.scrollIntoView && window.matchMedia('(min-width: 861px)').matches) now.scrollIntoView({ block: 'nearest' });
  }

  function renderControls() {
    $('play').textContent = state.playing ? 'Пауза' : 'Пуск';
    $('prev').disabled = state.si === 0;
    $('next').disabled = state.si === steps().length - 1;
    $('speed').textContent = `${String(state.speed).replace('.', ',')}×`;
    $('m-attack').setAttribute('aria-pressed', String(state.mode === 'attack'));
    $('m-defence').setAttribute('aria-pressed', String(state.mode === 'defence'));
  }

  function go(si, animate, done) {
    state.si = Math.max(0, Math.min(steps().length - 1, si));
    closePop();
    renderExplain(); renderLog(); renderControls();
    showStep(animate, done);
  }

  function stop() { state.playing = false; clearTimeout(timer); renderControls(); }

  function playFrom(si) {
    state.playing = true;
    go(si, true, () => {
      if (!state.playing) return;
      if (state.si >= steps().length - 1) { stop(); return; }
      timer = setTimeout(() => playFrom(state.si + 1), 1500 / state.speed);
    });
  }

  function togglePlay() {
    if (state.playing) { stop(); return; }
    playFrom(state.si >= steps().length - 1 ? 0 : state.si + 1);
  }

  function setMode(mode) {
    if (state.mode === mode) return;
    stop();
    state.mode = mode;
    go(state.si, false);
  }

  function openLesson(i) {
    stop();
    state.li = i; state.si = 0; state.mode = 'attack';
    renderHead(); buildScene();
    go(0, false);
  }

  // ---------- Routing: the hash is the lesson id ----------
  let current = null;
  function route(h) {
    if (h === undefined) { try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; } }
    let i = LESSONS.findIndex((l) => l.id === h);
    if (i < 0) i = LESSONS.findIndex((l) => l.id === FIRST);
    if (LESSONS[i].id === current) return;
    current = LESSONS[i].id;
    openLesson(i);
  }

  function navTo(h) {
    closeDrawer();
    closePop();
    try { history.pushState(null, '', `#${h}`); } catch (e) {}
    route(h);
  }

  $('play').addEventListener('click', togglePlay);
  $('prev').addEventListener('click', () => { stop(); go(state.si - 1, false); });
  $('next').addEventListener('click', () => { stop(); go(state.si + 1, true); });
  $('again').addEventListener('click', () => { stop(); go(0, false); });
  $('speed').addEventListener('click', () => { state.speed = SPEEDS[(SPEEDS.indexOf(state.speed) + 1) % SPEEDS.length]; renderControls(); });
  $('m-attack').addEventListener('click', () => setMode('attack'));
  $('m-defence').addEventListener('click', () => setMode('defence'));
  document.querySelectorAll('#depth button').forEach((b) => b.addEventListener('click', () => { state.depth = b.dataset.depth; closePop(); renderExplain(); }));
  $('open-lessons').addEventListener('click', (ev) => openDrawer('lessons', ev.currentTarget));
  $('open-glossary').addEventListener('click', (ev) => openDrawer('glossary', ev.currentTarget));
  $('tab-lessons').addEventListener('click', () => { dr.tab = 'lessons'; closePop(); renderDrawer(); });
  $('tab-glossary').addEventListener('click', () => { dr.tab = 'glossary'; closePop(); renderDrawer(); });
  $('drawer-q').addEventListener('input', (ev) => { dr.q = ev.target.value; renderDrawer(); });
  $('drawer-x').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest && ev.target.closest('[data-term]');
    if (t) { openTerm(t.dataset.term, t); return; }
    if (!ev.target.closest || !ev.target.closest('#pop')) closePop();
  });
  window.addEventListener('resize', placePop);
  document.addEventListener('scroll', (ev) => { if (ev.target !== $('pop') && !$('pop').contains(ev.target)) closePop(); }, true);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { if (!$('pop').hidden) closePop(true); else closeDrawer(); return; }
    if (ev.target.closest && ev.target.closest('input, textarea, select')) return;
    const onTerm = ev.target.closest && ev.target.closest('[data-term], #pop');
    if (onTerm) {
      if ((ev.key === 'Enter' || ev.code === 'Space') && ev.target.tagName !== 'BUTTON' && ev.target.dataset.term) { ev.preventDefault(); openTerm(ev.target.dataset.term, ev.target); }
      return;
    }
    if (!$('drawer').hidden) return;
    if (ev.code === 'Space') { ev.preventDefault(); togglePlay(); }
    else if (ev.key === 'ArrowRight') { stop(); go(state.si + 1, true); }
    else if (ev.key === 'ArrowLeft') { stop(); go(state.si - 1, false); }
    else if (ev.key.toLowerCase() === 'd' || ev.key.toLowerCase() === 'в') setMode(state.mode === 'attack' ? 'defence' : 'attack');
  });
  window.addEventListener('popstate', () => route());
  window.addEventListener('hashchange', () => route());

  window.__app = { state, LESSONS, SECTIONS, GLOSSARY, CAT, go, setMode, openLesson, togglePlay, navTo, openTerm, openDrawer, closeDrawer, findTerms };
  route();
</script>
